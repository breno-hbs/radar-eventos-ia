# Configuração do Alembic para uso na linha de comando (`alembic upgrade head`).
# A URL do banco NÃO fica aqui: o env.py lê DATABASE_URL do ambiente (D8, D12).
[alembic]
script_location = %(here)s/src/radar/banco/migracoes
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
