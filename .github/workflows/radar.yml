name: Radar

# Execução agendada do radar (D23): 7h40, 12h40 e 19h40 em São Paulo (UTC-3, sem horário de
# verão), mais disparo manual. Migra o banco e executa; nunca duas execuções ao mesmo tempo.
on:
  schedule:
    - cron: "40 10,15,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-executar
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Migrar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: radar migrar

      - name: Executar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: radar executar --ultimo-commit-em "$(git log -1 --format=%cI)"
